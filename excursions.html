<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ექსკურსიები</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 0; }
        header { background: #fff; padding: 15px; }
        .back-btn { text-decoration: none; font-size: 20px; margin-right: 15px; }
        .tour-card { background: #fff; margin: 15px; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tour-img { height: 120px; background: #ddd; display: flex; justify-content: center; align-items: center; }
        .tour-info { padding: 15px; }
        .tour-info p { margin: 5px 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header><a href="index.html" class="back-btn">⬅️</a> <b>🚌 ექსკურსიები</b></header>
    <div class="tour-card">
        <div class="tour-img">ფოტო</div>
        <div class="tour-info">
            <h3>ტური ყაზბეგში</h3>
            <p>📍 სტეფანწმინდა | 📅 1-2 ივნისი</p>
            <p>⏰ გასვლა: 08:00 სთ</p>
        </div>
    </div>
</body>
</html>
