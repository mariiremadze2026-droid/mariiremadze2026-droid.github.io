<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ბიბლიოთეკა</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; }
        header { background-color: #ffffff; padding: 15px 20px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .back-btn { text-decoration: none; font-size: 20px; color: #2980b9; margin-right: 15px; }
        h1 { font-size: 1.2rem; color: #2c3e50; }
        .section { background: #ffffff; margin: 15px; padding: 20px; border-radius: 12px; }
        .book-card { display: flex; gap: 15px; background: #fdfdfd; border: 1px solid #eee; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .book-cover { width: 70px; height: 100px; background-color: #e0e0e0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; text-align: center; border: 1px solid #ddd; }
        .status-available { background-color: #e8f8f5; color: #27ae60; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">⬅️ უკან</a>
        <h1>📚 ბიბლიოთეკა</h1>
    </header>

    <div class="section">
        <input type="text" placeholder="🔍 მოძებნე წიგნი..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px;">
        
        <div class="book-card">
            <div class="book-cover">ვეფხისტყაოსანი</div>
            <div>
                <h3 style="font-size: 1.1rem;">„ვეფხისტყაოსანი“</h3>
                <p style="font-size: 0.9rem; color: #555;">შოთა რუსთაველი</p>
                <span class="status-available" style="display: inline-block; margin-top: 10px;">ხელმისაწვდომია</span>
            </div>
        </div>
    </div>

</body>
</html>
