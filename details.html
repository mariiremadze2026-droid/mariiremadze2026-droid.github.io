<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>დეტალური ინფორმაცია</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; line-height: 1.6; }
        header { background-color: #ffffff; padding: 15px 20px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .back-btn { text-decoration: none; font-size: 20px; color: #2980b9; margin-right: 15px; }
        h1 { font-size: 1.2rem; color: #2c3e50; }
        .section { background: #ffffff; margin: 15px; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .section h2 { font-size: 1.2rem; color: #2980b9; margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; }
        .profile-card { text-align: center; margin-bottom: 20px; }
        .profile-pic { width: 100px; height: 100px; background-color: #e0e0e0; border-radius: 50%; margin: 0 auto 10px auto; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .info-block { background: #fdfdfd; border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <!-- დაბრუნება მთავარ გვერდზე -->
        <a href="index.html" class="back-btn">⬅️ უკან</a>
        <h1>დირექტორი და სკოლა</h1>
    </header>

    <div class="section">
        <h2>დირექტორის გვერდი</h2>
        <div class="profile-card">
            <div class="profile-pic">👤</div>
            <h3>სახელი გვარი</h3>
            <p>სკოლის დირექტორი</p>
        </div>
        <div class="info-block">
            <p>"ძვირფასო მოსწავლეებო, მოხარული ვარ მოგესალმოთ..."</p>
        </div>
    </div>

    <div class="section">
        <h2>🏛️ სკოლის შესახებ</h2>
        <div class="info-block">
            <p><strong>დაარსების წელი:</strong> 1995 წელი</p>
            <p><strong>მისია:</strong> აღვზარდოთ თავისუფალი და მოაზროვნე მოქალაქეები.</p>
        </div>
    </div>

</body>
</html>
