<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კონტაქტი</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 0; }
        header { background: #fff; padding: 15px; }
        .back-btn { text-decoration: none; font-size: 20px; margin-right: 15px; }
        .section { background: #fff; margin: 15px; padding: 20px; border-radius: 12px; }
        .info p { margin: 10px 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #2980b9; color: #fff; border: none; border-radius: 8px; }
    </style>
</head>
<body>
    <header><a href="index.html" class="back-btn">⬅️</a> <b>📍 კონტაქტი</b></header>
    <div class="section info">
        <p>🏫 თბილისი, ჭავჭავაძის გამზ. #1</p>
        <p>📞 +995 32 2 123 456</p>
        <p style="border: none;">🕒 ორშ-პარ: 09:00 - 18:00</p>
    </div>
    <div class="section">
        <h3>მოგვწერეთ</h3>
        <input type="text" placeholder="სახელი">
        <textarea rows="4" placeholder="ტექსტი..."></textarea>
        <button>გაგზავნა</button>
    </div>
</body>
</html>
