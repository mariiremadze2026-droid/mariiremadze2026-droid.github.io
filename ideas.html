<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>შენი იდეა</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 0; }
        header { background: #fff; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .back-btn { text-decoration: none; font-size: 20px; margin-right: 15px; }
        .section { background: #fff; margin: 15px; padding: 20px; border-radius: 12px; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
        button.submit { width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 8px; font-weight: bold; }
        .idea { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .support-btn { background: #eaf2f8; color: #2980b9; border: none; padding: 5px 10px; border-radius: 15px; margin-top: 10px; }
    </style>
</head>
<body>
    <header><a href="index.html" class="back-btn">⬅️</a> <b>💡 შენი იდეა</b></header>
    <div class="section">
        <h3>გააზიარე იდეა</h3>
        <input type="text" placeholder="იდეის სათაური">
        <textarea rows="3" placeholder="აღწერა..."></textarea>
        <button class="submit">გაგზავნა</button>
    </div>
    <div class="section">
        <h3>🔥 პოპულარული იდეები</h3>
        <div class="idea">
            <h4>ველოსადგომი ეზოში</h4>
            <p style="font-size: 0.9rem; color: #555;">ავტორი: გიორგი მ.</p>
            <button class="support-btn">👍 მხარს ვუჭერ (45)</button>
        </div>
    </div>
</body>
</html>
