<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მიღწევები</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 0; }
        header { background: #fff; padding: 15px; }
        .back-btn { text-decoration: none; font-size: 20px; margin-right: 15px; }
        .section { background: #fff; margin: 15px; padding: 20px; border-radius: 12px; }
        .card { display: flex; gap: 15px; border: 1px solid #eee; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .photo { width: 50px; height: 50px; background: #ddd; border-radius: 50%; }
        .badge { background: #f1c40f; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <header><a href="index.html" class="back-btn">⬅️</a> <b>🏆 მიღწევები & Hall of Fame</b></header>
    <div class="section">
        <h3>მოსწავლეთა მიღწევები</h3>
        <div class="card">
            <div class="photo"></div>
            <div>
                <h4 style="margin: 0 0 5px 0;">ლუკა მაისურაძე</h4>
                <span class="badge">I ადგილი</span>
                <p style="margin: 5px 0 0 0; font-size: 0.9rem;">ოლიმპიადა ფიზიკაში</p>
            </div>
        </div>
        <h3 style="margin-top: 20px;">🌟 Hall of Fame</h3>
        <div class="card">
            <div class="photo"></div>
            <div>
                <h4 style="margin: 0 0 5px 0;">ნიკოლოზ წერეთელი</h4>
                <p style="margin: 0; font-size: 0.9rem;">კურსდამთავრებული (1998)</p>
            </div>
        </div>
    </div>
</body>
</html>
