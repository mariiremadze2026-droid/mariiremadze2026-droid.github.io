<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>სკოლის ოფიციალური ვებგვერდი</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; line-height: 1.6; }
        header { background-color: #ffffff; padding: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .logo-placeholder { width: 60px; height: 60px; background-color: #e0e0e0; border-radius: 50%; margin: 0 auto 10px auto; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        h1 { font-size: 1.4rem; color: #2c3e50; }
        .hero { width: 100%; height: 220px; background-color: #34495e; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .section { background: #ffffff; margin: 15px; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .section h2 { font-size: 1.2rem; color: #2980b9; margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; }
        .quick-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .btn { background-color: #2980b9; color: white; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; flex: 1 1 45%; text-align: center; }
        .card { background: #fdfdfd; border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-placeholder">🏫</div>
        <h1>სკოლის სახელი</h1>
    </header>

    <div class="hero">
        [მთავარი ფოტო / ვიდეო]
    </div>

    <div class="section">
        <h2>სწრაფი ნავიგაცია</h2>
        <div class="quick-buttons">
            <!-- აქ არის მიბმული სხვა ფაილები -->
            <a href="details.html" class="btn">დირექტორი და სკოლა</a>
            <a href="staff.html" class="btn">მასწავლებლები</a>
            <a href="library.html" class="btn">ბიბლიოთეკა</a>
        </div>
    </div>

    <div class="section">
        <h2>რატომ ჩვენი სკოლა?</h2>
        <p>✅ მაღალი აკადემიური მოსწრება<br>✅ თანამედროვე ინფრასტრუქტურა<br>✅ კვალიფიციური პედაგოგები</p>
    </div>

    <div class="section">
        <h2>ბოლო სიახლეები</h2>
        <div class="card">
            <strong>15 მაისი, 2024</strong><br>
            სკოლის მოსწავლეებმა გაიმარჯვეს რესპუბლიკურ ოლიმპიადაში...
        </div>
    </div>

</body>
</html>
